name: Workflow - Sync Database (Production to Development)

on:
  schedule:
    # Executa toda segunda-feira às 04:00 UTC (01:00 BRT)
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: sync-development-db
  cancel-in-progress: true

jobs:
  sync-database:
    runs-on: ubuntu-latest
    steps:
      - name: Executar Sync na VM Oracle
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ORACLE_IP }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            echo "=========================================="
            echo "Iniciando sincronização de Production para Development"
            echo "=========================================="

            docker exec -i postgres sh -c "pg_dump -U postgres \
              --clean \
              --if-exists \
              --no-owner \
              --no-privileges \
              finance_assets_db | psql '${{ secrets.DEVELOPMENT_DATABASE_URL }}'"

            echo "=========================================="
            echo "Sincronização concluída com sucesso!"
            echo "=========================================="
