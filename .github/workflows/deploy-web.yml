name: Workflow - Finance Assets (Web)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag da Versão (ex: v1, latest)'
        required: true
        default: 'latest'

  push:
    branches: ["main"]
    paths:
      - 'apps/web/**'
      - 'packages/lib-db/**'
      - 'packages/env/**'
      - 'packages/config/**'
      - '.github/workflows/deploy-web.yml'

  pull_request:
    branches: ["main"]
    paths:
      - 'apps/web/**'
      - 'packages/lib-db/**'
      - 'packages/env/**'
      - 'packages/config/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # JOB 1: Cria e publica a imagem Docker no GHCR
  build-push:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'deploy:'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PASSWORD }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/finance-assets-web:${{ inputs.version || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SERVER_URL=${{ vars.NEXT_PUBLIC_SERVER_URL }}
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_AVATAR_URL=${{ vars.NEXT_PUBLIC_AVATAR_URL }}

  # JOB 2: Acessa a Oracle VM via SSH e atualiza o container
  deploy-oracle:
    needs: build-push
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'deploy:'))
    runs-on: ubuntu-latest
    steps:
      - name: Executar Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ORACLE_IP }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            # 1. Autenticar no GHCR
            echo "${{ secrets.GHCR_PASSWORD }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2. Baixar a imagem atualizada
            docker pull ghcr.io/${{ github.repository_owner }}/finance-assets-web:${{ inputs.version || 'latest' }}

            # 3. Remover a versão antiga se estiver rodando
            docker stop finance-assets-web || true
            docker rm finance-assets-web || true

            # 4. Iniciar o container com as variáveis de ambiente na memória
            docker run -d \
              --name finance-assets-web \
              --restart unless-stopped \
              --network public_network \
              --label "com.docker.compose.project=finance-assets" \
              --label "com.docker.compose.service=web" \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e BETTER_AUTH_SECRET="${{ secrets.BETTER_AUTH_SECRET }}" \
              -e BETTER_AUTH_URL="${{ vars.BETTER_AUTH_URL }}" \
              -e N8N_URL="${{ vars.N8N_URL }}" \
              ghcr.io/${{ github.repository_owner }}/finance-assets-web:${{ inputs.version || 'latest' }}

            # 5. Limpeza de imagens antigas sem uso
            docker image prune -f

