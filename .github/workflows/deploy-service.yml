name: Workflow - Finance Assets (Service)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag da Versão (ex: v1, latest)'
        required: true
        default: 'latest'

  push:
    branches: ["main"]
    paths:
      - 'apps/service/**'
      - 'packages/lib-db/**'
      - '.github/workflows/deploy-service.yml'

  pull_request:
    branches: ["main"]
    paths:
      - 'apps/service/**'
      - 'packages/lib-db/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # JOB 1: Cria e publica a imagem Docker no GHCR
  build-push:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'deploy:'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PASSWORD }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/service/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/finance-assets-api:${{ inputs.version || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # JOB 2: Acessa a Oracle VM via SSH e atualiza o container
  deploy-oracle:
    needs: build-push
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'deploy:'))
    runs-on: ubuntu-latest
    steps:
      - name: Executar Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_IP }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            # 1. Autenticar no GHCR
            echo "${{ secrets.GHCR_PASSWORD }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2. Baixar a imagem atualizada
            docker pull ghcr.io/${{ github.repository_owner }}/finance-assets-api:${{ inputs.version || 'latest' }}

            # 3. Remover a versão antiga se estiver rodando
            docker stop finance-assets-api || true
            docker rm finance-assets-api || true

            # 4. Iniciar o container com as variáveis de ambiente na memória
            docker run -d \
              --name finance-assets-api \
              --restart unless-stopped \
              --network public_network \
              --label "com.docker.compose.project=finance-assets" \
              --label "com.docker.compose.service=service" \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e PORT=3333 \
              -e R2_ACCOUNT_ID="${{ secrets.R2_ACCOUNT_ID }}" \
              -e R2_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID }}" \
              -e R2_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_ACCESS_KEY }}" \
              -e ALPHA_VANTAGE_API_KEY="${{ secrets.ALPHA_VANTAGE_API_KEY }}" \
              -e BRAPI_TOKEN="${{ secrets.BRAPI_TOKEN }}" \
              -e REDIS_HOST="${{ vars.REDIS_HOST }}" \
              -e REDIS_PORT="${{ vars.REDIS_PORT }}" \
              -e REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}" \
              ghcr.io/${{ github.repository_owner }}/finance-assets-api:${{ inputs.version || 'latest' }}

            # 5. Limpeza de imagens antigas sem uso
            docker image prune -f

