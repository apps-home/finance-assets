services:
  api:
    image: ghcr.io/${OWNER_REPO}/finance-assets-api:${IMAGE_TAG}
    container_name: finance-assets-api
    restart: unless-stopped
    ports:
      - "${PORT}:${PORT}"
    environment:
      - PORT=${PORT}
      - DATABASE_URL
      - R2_ACCOUNT_ID
      - R2_ACCESS_KEY_ID
      - R2_SECRET_ACCESS_KEY
      - ALPHA_VANTAGE_API_KEY
      - BRAPI_TOKEN
      - REDIS_HOST
      - REDIS_PORT
      - REDIS_PASSWORD
    networks:
      - public_network

networks:
  public_network:
    external: true
